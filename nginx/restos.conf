# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name restos.uz www.restos.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restos.uz www.restos.uz;

    # SSL certificates (mounted from host /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/restos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restos.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/restos.uz/chain.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy to Next.js app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Next emits `s-maxage=31536000, stale-while-revalidate` on statically
        # prerendered HTML — a ONE YEAR licence for any shared cache (a CDN, an
        # ISP proxy, a corporate proxy) to keep serving a page after we have
        # corrected it. A cache-busting query string does not help, because
        # many intermediaries normalise the query away for HTML.
        #
        # Hashed assets under /_next/static/ keep their immutable year below;
        # their filenames change when the content does. HTML filenames do not,
        # so HTML gets a short shared lifetime and must revalidate. If a false
        # claim ever has to come down in an hour, this is the line that makes
        # that possible.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300, must-revalidate" always;
    }

    # Cache Next.js static assets aggressively
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}

# ─── Telegram sound bot (bot.restos.uz) ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bot.restos.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.restos.uz;

    ssl_certificate     /etc/letsencrypt/live/bot.restos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.restos.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bot.restos.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://tg_soundbot:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
