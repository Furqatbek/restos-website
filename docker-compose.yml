services:
  app:
    build: .
    expose:
      - "3000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/restos.conf:/etc/nginx/conf.d/restos.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # A plain host folder (not a named volume) so certbot on the host can
      # write Let's Encrypt challenges here and renew without stopping nginx.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - web

volumes:
  sqlite_data:

networks:
  web:
    external: true
